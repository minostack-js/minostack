enum UserResponseRole {
  admin
  member
}

"""User record returned by the API."""
type UserResponse {
  id: String!
  email: String!
  name: String!
  role: UserResponseRole!
  createdAt: String!
}

"""User record returned by the API."""
input UserResponseInput {
  id: String!
  email: String!
  name: String!
  role: UserResponseRole = member
  createdAt: String!
}
