  - "@oxlint/binding-linux-x64-musl@1.82.0"
  - "@oxlint/binding-openharmony-arm64@1.82.0"
  - "@oxlint/binding-win32-arm64-msvc@1.82.0"
  - "@oxlint/binding-win32-ia32-msvc@1.82.0"
